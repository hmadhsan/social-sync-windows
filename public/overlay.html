<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ammi overlay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #pod {
        position: absolute;
        top: 0;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        transform: translateY(-130%);
        transition: transform 0.85s cubic-bezier(0.22, 1.4, 0.36, 1);
        will-change: transform;
      }
      #pod.in {
        transform: translateY(0);
      }
      #ammi {
        position: relative;
        width: 150px;
        flex: none;
        filter: drop-shadow(0 10px 22px rgba(50, 20, 10, 0.28));
      }
      #bubble {
        position: relative;
        margin-top: 46px;
        max-width: 330px;
        padding: 14px 18px 15px;
        border-radius: 4px 20px 20px 20px;
        background: #fffdf6;
        border: 1px solid rgba(90, 55, 30, 0.14);
        box-shadow: 0 18px 40px -18px rgba(60, 30, 12, 0.45);
        opacity: 0;
        transform: translateY(-6px) scale(0.96);
        transform-origin: top left;
        transition:
          opacity 0.4s ease,
          transform 0.5s cubic-bezier(0.22, 1.3, 0.36, 1);
      }
      #pod.in #bubble {
        opacity: 1;
        transform: translateY(0) scale(1);
        transition-delay: 0.34s;
      }
      #urdu {
        margin: 0;
        color: #3a2318;
        font-size: 19px;
        line-height: 1.32;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #english {
        margin: 6px 0 0;
        color: #8b6a55;
        font-size: 14px;
        line-height: 1.35;
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-1.6deg);
        }
        50% {
          transform: rotate(1.6deg);
        }
      }
      #swayer {
        transform-origin: 100px 8px;
        animation: sway 4.6s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="pod">
        <svg id="ammi" viewBox="0 0 200 250" aria-hidden="true">
          <g id="swayer">
            <!-- hanging dupatta / body coming down from the top edge -->
            <path
              id="dupattaBack"
              d="M100 0 C40 0 26 60 24 120 C22 170 34 210 44 250 L156 250 C166 210 178 170 176 120 C174 60 160 0 100 0 Z"
              fill="#c2455f"
            />
            <path
              d="M100 0 C62 0 46 40 42 96 C64 74 78 66 100 66 C122 66 136 74 158 96 C154 40 138 0 100 0 Z"
              fill="#a8324b"
            />
            <!-- neck -->
            <rect x="88" y="120" width="24" height="26" rx="10" fill="#c98d63" />
            <!-- shoulders / kameez -->
            <path
              d="M100 136 C68 136 48 168 44 250 L156 250 C152 168 132 136 100 136 Z"
              fill="#1f6b52"
            />
            <path d="M100 140 L100 250" stroke="#17553f" stroke-width="3" />
            <!-- hair -->
            <path
              d="M100 24 C68 24 54 52 56 86 C58 108 62 120 66 128 C60 100 64 70 100 70 C136 70 140 100 134 128 C138 120 142 108 144 86 C146 52 132 24 100 24 Z"
              fill="#241a18"
            />
            <!-- face -->
            <ellipse cx="100" cy="94" rx="38" ry="42" fill="#e0a97c" />
            <!-- cheeks -->
            <ellipse id="cheekL" cx="80" cy="106" rx="9" ry="6" fill="#d0715f" opacity="0.4" />
            <ellipse id="cheekR" cx="120" cy="106" rx="9" ry="6" fill="#d0715f" opacity="0.4" />
            <!-- brows -->
            <path
              id="browL"
              d="M82 78 C86 74 94 74 98 77"
              stroke="#2b1d1a"
              stroke-width="4"
              stroke-linecap="round"
              fill="none"
            />
            <path
              id="browR"
              d="M118 78 C114 74 106 74 102 77"
              stroke="#2b1d1a"
              stroke-width="4"
              stroke-linecap="round"
              fill="none"
            />
            <!-- eyes -->
            <g id="eyes">
              <ellipse cx="87" cy="90" rx="7.5" ry="8" fill="#fffdf7" />
              <ellipse cx="113" cy="90" rx="7.5" ry="8" fill="#fffdf7" />
              <g id="pupils">
                <circle cx="87" cy="91" r="4" fill="#2b1d1a" />
                <circle cx="113" cy="91" r="4" fill="#2b1d1a" />
              </g>
              <rect id="lidL" x="79" y="82" width="16" height="0" fill="#e0a97c" />
              <rect id="lidR" x="105" y="82" width="16" height="0" fill="#e0a97c" />
            </g>
            <!-- nose + nose pin -->
            <path
              d="M100 96 C97 104 98 108 102 109"
              stroke="#b97d53"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
            <circle cx="93" cy="107" r="2" fill="#e8c46a" />
            <!-- mouth -->
            <path
              id="mouth"
              d="M91 118 C96 124 104 124 109 118"
              stroke="#8c3a34"
              stroke-width="3.5"
              fill="none"
              stroke-linecap="round"
            />
            <!-- dupatta over the head -->
            <path
              d="M100 20 C64 20 48 50 50 92 C52 74 58 62 66 56 C74 34 84 30 100 30 C116 30 126 34 134 56 C142 62 148 74 150 92 C152 50 136 20 100 20 Z"
              fill="#e4657f"
            />
            <path
              d="M52 88 C46 130 46 176 52 214 C60 176 60 128 56 92 Z"
              fill="#e4657f"
              opacity="0.95"
            />
            <path
              d="M148 88 C154 130 154 176 148 214 C140 176 140 128 144 92 Z"
              fill="#e4657f"
              opacity="0.95"
            />
            <!-- earrings -->
            <circle cx="63" cy="100" r="4" fill="#e8c46a" />
            <circle cx="137" cy="100" r="4" fill="#e8c46a" />
            <!-- raised hand -->
            <g id="hand">
              <path
                d="M150 172 C160 160 166 146 168 136"
                stroke="#1f6b52"
                stroke-width="18"
                stroke-linecap="round"
                fill="none"
              />
              <circle cx="170" cy="130" r="12" fill="#e0a97c" />
            </g>
          </g>
        </svg>
        <div id="bubble">
          <p id="urdu">Pani pee lo.</p>
          <p id="english">Drink some water.</p>
        </div>
      </div>
    </div>

    <script>
      const REMINDERS = [
        { key: "water", urdu: "Pani pee lo.", en: "Drink some water.", mood: "caring" },
        {
          key: "food",
          urdu: "Khana kha liya? Laptop ruk sakta hai.",
          en: "Have you eaten? The laptop can wait.",
          mood: "caring",
        },
        {
          key: "break",
          urdu: "Bohat der baith gaye. Thora chal lo.",
          en: "You've been sitting a long time. Walk a little.",
          mood: "scold",
        },
        { key: "eyes", urdu: "Ankhon ko aaram do.", en: "Give your eyes a rest.", mood: "caring" },
        { key: "tea", urdu: "Chai bana doon?", en: "Shall I make you some tea?", mood: "happy" },
        {
          key: "posture",
          urdu: "Seedhi tarhan baitho, kamar kharab ho jaye gi.",
          en: "Sit up straight, you'll ruin your back.",
          mood: "scold",
        },
        {
          key: "late",
          urdu: "Ab tak jaag rahe ho? Kal kaam nahi hai?",
          en: "Still awake? Don't you have work tomorrow?",
          mood: "sleepy",
        },
        {
          key: "charger",
          urdu: "Charger laga lo, battery khatam ho rahi hai.",
          en: "Plug the charger in, your battery is low.",
          mood: "scold",
        },
        { key: "medicine", urdu: "Dawai le li?", en: "Did you take your medicine?", mood: "caring" },
        {
          key: "morning",
          urdu: "Subha bakhair! Aaj apna khayal rakhna.",
          en: "Good morning! Look after yourself today.",
          mood: "happy",
        },
        {
          key: "call",
          urdu: "Break mein phone karna, awaz sunni hai.",
          en: "Call me on your break, I want to hear your voice.",
          mood: "caring",
        },
        {
          key: "praise",
          urdu: "Shabash mera bacha. Ab thora aaram karo.",
          en: "Well done, my child. Now rest a bit.",
          mood: "happy",
        },
        {
          key: "phone",
          urdu: "Phone rakh do thori dair.",
          en: "Put the phone down for a while.",
          mood: "scold",
        },
        {
          key: "dua",
          urdu: "Duaon mein yaad rakhti hoon.",
          en: "You're always in my prayers.",
          mood: "happy",
        },
      ];

      const defaults = {
        position: "center", // center | left | right
        interval: 25, // seconds between visits
        visible: 9, // seconds she stays on screen
        translation: true,
        scale: 1,
        auto: true,
        scenario: 0,
        enabled: REMINDERS.map((r) => r.key),
      };

      let config = { ...defaults };
      const pod = document.getElementById("pod");
      const svg = document.getElementById("ammi");
      const urdu = document.getElementById("urdu");
      const english = document.getElementById("english");
      const pupils = document.getElementById("pupils");
      const lidL = document.getElementById("lidL");
      const lidR = document.getElementById("lidR");
      const mouth = document.getElementById("mouth");
      const browL = document.getElementById("browL");
      const browR = document.getElementById("browR");
      const cheekL = document.getElementById("cheekL");
      const cheekR = document.getElementById("cheekR");
      const hand = document.getElementById("hand");

      let index = 0;
      let visitTimer = null;
      let hideTimer = null;

      function pool() {
        const on = REMINDERS.filter((r) => config.enabled.includes(r.key));
        return on.length ? on : REMINDERS;
      }

      function place() {
        const w = window.innerWidth;
        pod.style.transform = pod.classList.contains("in") ? "" : "";
        svg.style.width = 150 * config.scale + "px";
        const podWidth = pod.offsetWidth || 480;
        let left = (w - podWidth) / 2;
        if (config.position === "left") left = Math.min(40, w * 0.04);
        if (config.position === "right") left = w - podWidth - Math.min(40, w * 0.04);
        pod.style.left = Math.max(8, left) + "px";
      }

      function mood(kind) {
        const wave = kind === "happy" || kind === "caring";
        hand.style.transition = "transform .5s ease";
        hand.style.transformOrigin = "150px 175px";
        hand.style.transform = wave ? "rotate(-12deg)" : "rotate(10deg)";
        if (kind === "scold") {
          browL.setAttribute("d", "M82 74 C86 78 94 79 98 80");
          browR.setAttribute("d", "M118 74 C114 78 106 79 102 80");
          mouth.setAttribute("d", "M90 121 C96 116 104 116 110 121");
          cheekL.setAttribute("opacity", "0.5");
          cheekR.setAttribute("opacity", "0.5");
        } else if (kind === "sleepy") {
          browL.setAttribute("d", "M82 80 C86 78 94 78 98 80");
          browR.setAttribute("d", "M118 80 C114 78 106 78 102 80");
          mouth.setAttribute("d", "M93 119 C98 121 103 121 108 119");
          cheekL.setAttribute("opacity", "0.25");
          cheekR.setAttribute("opacity", "0.25");
        } else if (kind === "happy") {
          browL.setAttribute("d", "M82 76 C86 71 94 71 98 75");
          browR.setAttribute("d", "M118 76 C114 71 106 71 102 75");
          mouth.setAttribute("d", "M88 116 C96 128 104 128 112 116");
          cheekL.setAttribute("opacity", "0.55");
          cheekR.setAttribute("opacity", "0.55");
        } else {
          browL.setAttribute("d", "M82 78 C86 74 94 74 98 77");
          browR.setAttribute("d", "M118 78 C114 74 106 74 102 77");
          mouth.setAttribute("d", "M91 118 C96 124 104 124 109 118");
          cheekL.setAttribute("opacity", "0.4");
          cheekR.setAttribute("opacity", "0.4");
        }
      }

      function paint(reminder) {
        urdu.textContent = reminder.urdu;
        english.textContent = reminder.en;
        english.style.display = config.translation ? "" : "none";
        mood(reminder.mood);
        place();
      }

      function show(reminder) {
        clearTimeout(hideTimer);
        paint(reminder);
        requestAnimationFrame(() => {
          pod.classList.add("in");
          place();
        });
        if (config.auto) {
          hideTimer = setTimeout(hide, Math.max(3, config.visible) * 1000);
        }
      }

      function hide() {
        pod.classList.remove("in");
      }

      function next() {
        const list = pool();
        index = (index + 1) % list.length;
        show(list[index]);
      }

      function loop() {
        clearInterval(visitTimer);
        if (!config.auto) return;
        visitTimer = setInterval(next, Math.max(6, config.interval) * 1000);
      }

      function apply(patch) {
        config = { ...config, ...patch };
        if (!Array.isArray(config.enabled) || !config.enabled.length) config.enabled = defaults.enabled;
        const list = pool();
        if (typeof patch.scenario === "number") {
          const wanted = REMINDERS[patch.scenario % REMINDERS.length];
          const at = list.findIndex((r) => r.key === wanted.key);
          index = at < 0 ? 0 : at;
        }
        index = Math.min(index, list.length - 1);
        show(list[index]);
        loop();
      }

      // blinking + gentle idle life
      setInterval(() => {
        const h = 9;
        lidL.setAttribute("height", h);
        lidR.setAttribute("height", h);
        setTimeout(() => {
          lidL.setAttribute("height", 0);
          lidR.setAttribute("height", 0);
        }, 130);
      }, 3800);

      // her eyes follow the cursor
      function look(x, y) {
        const box = svg.getBoundingClientRect();
        if (!box.width) return;
        const cx = box.left + box.width / 2;
        const cy = box.top + box.height * 0.38;
        const dx = Math.max(-1, Math.min(1, (x - cx) / 380));
        const dy = Math.max(-1, Math.min(1, (y - cy) / 320));
        pupils.setAttribute("transform", `translate(${dx * 2.6} ${dy * 2})`);
      }
      window.addEventListener("mousemove", (e) => look(e.clientX, e.clientY));
      window.addEventListener("resize", place);

      // config via query string (web demo default), postMessage (iframe) or IPC (Electron)
      const params = new URLSearchParams(location.search);
      const fromQuery = {};
      for (const [k, v] of params) {
        if (k === "enabled") fromQuery.enabled = v.split(",");
        else if (v === "true" || v === "false") fromQuery[k] = v === "true";
        else fromQuery[k] = isNaN(Number(v)) ? v : Number(v);
      }

      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ammi:config") apply(e.data.config || {});
      });
      if (window.ammi) {
        window.ammi.onConfig((incoming) => apply(incoming || {}));
        window.ammi.onCursor(({ x, y }) => look(x, y));
        window.ammi.onSay && window.ammi.onSay(() => next());
      }

      apply(fromQuery);
      if (window.parent !== window) window.parent.postMessage({ type: "ammi:ready" }, "*");
    </script>
  </body>
</html>
