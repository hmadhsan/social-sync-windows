<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ammi overlay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #pod {
        position: absolute;
        top: 0;
        display: flex;
        align-items: flex-start;
        gap: 16px;
        transform: translateY(-135%);
        transition: transform 0.85s cubic-bezier(0.22, 1.35, 0.36, 1);
        will-change: transform;
      }
      #pod.in {
        transform: translateY(0);
      }
      #ammi {
        position: relative;
        width: 140px;
        height: 140px;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: visible;
        flex: none;
        filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.32));
        transform-origin: top center;
        transition: transform 0.3s ease;
      }
      #ammiImg {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: top center;
        display: block;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #bubble {
        position: relative;
        margin-top: 32px;
        max-width: 320px;
        padding: 16px 22px;
        border-radius: 20px;
        background: #ffffff;
        border: 1px solid rgba(222, 222, 216, 0.85);
        box-shadow: 0 14px 38px rgba(0, 0, 0, 0.15);
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
        transform-origin: top left;
        transition:
          opacity 0.35s ease,
          transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #bubble::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 24px;
        width: 0;
        height: 0;
        border-top: 7px solid transparent;
        border-bottom: 7px solid transparent;
        border-right: 8px solid #ffffff;
      }
      #pod.in #bubble {
        opacity: 1;
        transform: translateY(0) scale(1);
        transition-delay: 0.22s;
      }
      #urdu {
        margin: 0;
        color: #151515;
        font-size: 17px;
        line-height: 1.35;
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      #english {
        margin: 5px 0 0;
        color: #727270;
        font-size: 13.5px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="pod">
        <div id="ammi">
          <img id="ammiImg" src="ammi-portrait.png" alt="Ammi portrait" />
        </div>
        <div id="bubble">
          <p id="urdu">Pani pee lo.</p>
          <p id="english">Drink some water.</p>
        </div>
      </div>
    </div>

    <script>
      const REMINDERS = [
        {
          key: "water",
          urdu: "Pani pee lo.",
          en: "Drink some water.",
          de: "Trink ein bisschen Wasser.",
          pa: "Paani pee lawo ji.",
          mood: "caring",
        },
        {
          key: "food",
          urdu: "Khana kha liya? Laptop ruk sakta hai.",
          en: "Have you eaten? The laptop can wait.",
          de: "Hast du gegessen? Der Laptop wartet.",
          pa: "Roti khaa layi? Laptop kithe bhajja jaanda.",
          mood: "caring",
        },
        {
          key: "break",
          urdu: "Bohat der baith gaye. Thora chal lo.",
          en: "You've been sitting a long time. Walk a little.",
          de: "Zu lange gesessen. Lauf ein bisschen rum.",
          pa: "Badi der ho gayi baitheya nu. Thora turr phirr lo.",
          mood: "scold",
        },
        {
          key: "eyes",
          urdu: "Ankhon ko aaram do.",
          en: "Give your eyes a rest.",
          de: "Gönn deinen Augen eine Pause.",
          pa: "Akhan nu aaram dewo thora.",
          mood: "caring",
        },
        {
          key: "tea",
          urdu: "Chai bana doon?",
          en: "Shall I make you some tea?",
          de: "Soll ich dir Tee kochen?",
          pa: "Tuhade layi chah bana dewan?",
          mood: "happy",
        },
        {
          key: "posture",
          urdu: "Seedhi tarhan baitho, peeth jhuki hui hai.",
          en: "Sit straight, your back is hunched.",
          de: "Sitz gerade, dein Rücken ist krumm.",
          pa: "Siddhe hoke baitho, pith jhukayi hoyi ae.",
          mood: "scold",
        },
        {
          key: "late",
          urdu: "Bohat raat ho gayi hai, so jao ab.",
          en: "It's very late, go to sleep now.",
          de: "Es ist spät, geh schlafen.",
          pa: "Badi raat ho gayi ae, so jao hunn.",
          mood: "caring",
        },
        {
          key: "charger",
          urdu: "Charger laga lo, band na ho jaye.",
          en: "Plug in the charger before it dies.",
          de: "Steck das Ladekabel ein.",
          pa: "Charger laa lo, band na ho jaave.",
          mood: "caring",
        },
        {
          key: "medicine",
          urdu: "Dawai ka waqt ho gaya, yaad hai?",
          en: "Time for medicine, remember?",
          de: "Zeit für Medizin, denkst du dran?",
          pa: "Dawaayi da vella ho gaya, chete ae?",
          mood: "caring",
        },
        {
          key: "morning",
          urdu: "Subha bakhair! Chai peeli?",
          en: "Good morning! Had your morning tea?",
          de: "Guten Morgen! Schon Tee getrunken?",
          pa: "Subha bakhair! Chah pee layi?",
          mood: "happy",
        },
        {
          key: "call",
          urdu: "Waqt mile to phone karna.",
          en: "Call home when you get a minute.",
          de: "Ruf an, wenn du kurz Zeit hast.",
          pa: "Vella mile te phone kar layin.",
          mood: "caring",
        },
        {
          key: "praise",
          urdu: "Shabash mera bacha. Mujhe fakhar hai.",
          en: "Well done my child. I'm so proud of you.",
          de: "Gut gemacht, mein Kind. Ich bin stolz auf dich.",
          pa: "Shabash mere bacheya. Mainu maan ae tere te.",
          mood: "happy",
        },
        {
          key: "phone",
          urdu: "Thora phone rakh do, aaraam karo.",
          en: "Put the phone down for a minute, rest.",
          de: "Leg das Handy mal weg, ruh dich aus.",
          pa: "Thora phone rakh de, aaraam kar le.",
          mood: "scold",
        },
        {
          key: "dua",
          urdu: "Har qadam par Allah hifazat farmaye.",
          en: "May Allah protect you at every step.",
          de: "Möge Gott dich auf jedem Schritt beschützen.",
          pa: "Rab tuhadi har qadam te raksha kare.",
          mood: "caring",
        },
      ];

      const defaults = {
        language: "urdu",
        position: "center",
        interval: 25 * 60,
        visible: 9,
        translation: true,
        scale: 1,
        auto: true,
        scenario: 0,
        enabled: REMINDERS.map((r) => r.key),
      };

      let config = { ...defaults };
      const pod = document.getElementById("pod");
      const ammi = document.getElementById("ammi");
      const ammiImg = document.getElementById("ammiImg");
      const urdu = document.getElementById("urdu");
      const english = document.getElementById("english");

      let index = 0;
      let visitTimer = null;
      let hideTimer = null;

      function pool() {
        const on = REMINDERS.filter((r) => config.enabled.includes(r.key));
        return on.length ? on : REMINDERS;
      }

      function place() {
        const w = window.innerWidth;
        if (ammi) {
          ammi.style.transform = `scale(${config.scale || 1})`;
        }
        const podWidth = pod.offsetWidth || 480;
        let left = (w - podWidth) / 2;
        if (config.position === "left") left = Math.min(40, w * 0.04);
        if (config.position === "right") left = w - podWidth - Math.min(40, w * 0.04);
        pod.style.left = Math.max(8, left) + "px";
      }

      function mood(kind) {
        if (!ammiImg) return;
        if (kind === "happy" || kind === "caring") {
          ammiImg.style.transform = "scale(1.04)";
        } else if (kind === "scold") {
          ammiImg.style.transform = "scale(1.01)";
        } else {
          ammiImg.style.transform = "scale(1)";
        }
      }

      function paint(reminder) {
        let line = reminder.urdu;
        let translation = reminder.en;

        if (config.language === "english") {
          line = reminder.en;
          translation = "";
        } else if (config.language === "german") {
          line = reminder.de || reminder.en;
          translation = reminder.en;
        } else if (config.language === "punjabi") {
          line = reminder.pa || reminder.urdu;
          translation = reminder.en;
        }

        urdu.textContent = line;
        english.textContent = translation;
        english.style.display = config.translation && translation ? "" : "none";
        mood(reminder.mood);
        place();
      }

      function show(reminder) {
        clearTimeout(hideTimer);
        paint(reminder);
        requestAnimationFrame(() => {
          pod.classList.add("in");
          place();
        });
        if (config.auto) {
          hideTimer = setTimeout(hide, Math.max(3, config.visible) * 1000);
        }
      }

      function hide() {
        pod.classList.remove("in");
      }

      function next() {
        const list = pool();
        index = (index + 1) % list.length;
        show(list[index]);
      }

      function loop() {
        clearInterval(visitTimer);
        if (!config.auto) return;
        visitTimer = setInterval(next, Math.max(6, config.interval) * 1000);
      }

      function apply(patch) {
        config = { ...config, ...patch };
        if (!Array.isArray(config.enabled) || !config.enabled.length) config.enabled = defaults.enabled;

        const list = pool();
        if (typeof patch.scenario === "number") {
          const wanted = REMINDERS[patch.scenario % REMINDERS.length];
          const at = list.findIndex((r) => r.key === wanted.key);
          index = at < 0 ? 0 : at;
        }
        index = Math.min(index, list.length - 1);
        show(list[index]);
        loop();
      }

      // Gentle gaze tracking when cursor moves
      function look(x, y) {
        if (!ammiImg) return;
        const box = ammiImg.getBoundingClientRect();
        if (!box.width) return;
        const cx = box.left + box.width / 2;
        const cy = box.top + box.height / 2;
        const dx = Math.max(-1, Math.min(1, (x - cx) / 400));
        const dy = Math.max(-1, Math.min(1, (y - cy) / 400));
        ammiImg.style.transform = `scale(1.03) translate(${dx * 3.5}px, ${dy * 2.5}px)`;
      }

      window.addEventListener("mousemove", (e) => look(e.clientX, e.clientY));
      window.addEventListener("resize", place);

      // config via query string (web demo default), postMessage (iframe) or IPC (Electron)
      const params = new URLSearchParams(location.search);
      const fromQuery = {};
      for (const [k, v] of params) {
        if (k === "enabled") fromQuery.enabled = v.split(",");
        else if (v === "true" || v === "false") fromQuery[k] = v === "true";
        else fromQuery[k] = isNaN(Number(v)) ? v : Number(v);
      }

      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ammi:config") apply(e.data.config || {});
      });
      if (window.ammi) {
        window.ammi.onConfig((incoming) => apply(incoming || {}));
        window.ammi.onCursor(({ x, y }) => look(x, y));
        window.ammi.onSay && window.ammi.onSay(() => next());
      }

      apply(fromQuery);
      if (window.parent !== window) window.parent.postMessage({ type: "ammi:ready" }, "*");
    </script>
  </body>
</html>
