<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>danglers overlay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <script>
      (function () {
        const NS = "http://www.w3.org/2000/svg";
        const svg = document.getElementById("scene");

        const config = {
          mode: "swing", // "swing" | "sitter"
          anchor: 0.5, // 0..1 horizontal position of the swing
          rope: 190, // px
          amplitude: 34, // degrees
          period: 2.6, // seconds per full back-and-forth
          loops: false,
          twoSeater: false,
          corner: "left", // sitter corner
          palette: 0,
        };

        const palettes = [
          { skin: "#f6c9a8", shirt: "#c6f24e", pants: "#3a2f6b", hair: "#2a1f45" },
          { skin: "#c68a63", shirt: "#ff7a6b", pants: "#1f3b5c", hair: "#17121f" },
        ];

        let cursor = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        function el(name, attrs, parent) {
          const node = document.createElementNS(NS, name);
          for (const k in attrs) node.setAttribute(k, attrs[k]);
          (parent || svg).appendChild(node);
          return node;
        }

        const MOUTHS = {
          smile: "M-4.5 -40 Q0 -36.5 4.5 -40",
          whee: "M-4.5 -40.5 Q0 -34 4.5 -40.5",
          flat: "M-4 -39 L4 -39",
        };

        // A character built out of animatable groups.
        function makeChar(parent, p, opts) {
          const o = opts || {};
          const root = el("g", {}, parent);
          const body = el("g", {}, root);

          // legs: each pivots at the hip
          const legs = [];
          for (const side of [-1, 1]) {
            const hip = el("g", { transform: `translate(${side * 8} -2)` }, body);
            el("path", { d: "M0 0 L1 30", stroke: p.pants, "stroke-width": "9", "stroke-linecap": "round", fill: "none" }, hip);
            const foot = el("g", { transform: "translate(1 30)" }, hip);
            el("path", { d: "M0 0 L9 3", stroke: "#1b1430", "stroke-width": "7", "stroke-linecap": "round" }, foot);
            legs.push({ hip, foot });
          }

          // torso
          el("rect", { x: "-15", y: "-34", width: "30", height: "36", rx: "12", fill: p.shirt }, body);

          // arms: each pivots at the shoulder
          const arms = [];
          for (const side of [-1, 1]) {
            const sh = el("g", { transform: `translate(${side * 13} -27)` }, body);
            el("path", { d: "M0 0 L0 -26", stroke: p.skin, "stroke-width": "7", "stroke-linecap": "round", fill: "none" }, sh);
            arms.push(sh);
          }

          // head
          const head = el("g", { transform: "translate(0 -34)" }, body);
          el("circle", { cx: "0", cy: "-14", r: "15", fill: p.skin }, head);
          const hair = el("g", {}, head);
          el("path", { d: "M-15 -18 A15 15 0 0 1 15 -18 L15 -24 A15 15 0 0 0 -15 -24 Z", fill: p.hair }, hair);
          const tuft = el("path", { d: "M-2 -29 Q4 -36 12 -32", stroke: p.hair, "stroke-width": "4", fill: "none", "stroke-linecap": "round" }, hair);
          const eyeL = el("circle", { cx: "-5.5", cy: "-13", r: "2.5", fill: "#1b1430" }, head);
          const eyeR = el("circle", { cx: "5.5", cy: "-13", r: "2.5", fill: "#1b1430" }, head);
          const lidL = el("rect", { x: "-9", y: "-19.5", width: "7", height: "0", fill: p.skin }, head);
          const lidR = el("rect", { x: "2", y: "-19.5", width: "7", height: "0", fill: p.skin }, head);
          const mouth = el("path", { d: MOUTHS.smile, stroke: "#1b1430", "stroke-width": "1.8", fill: "none", "stroke-linecap": "round", transform: "translate(0 20)" }, head);
          const blush = el("g", { opacity: "0" }, head);
          el("circle", { cx: "-10", cy: "-8", r: "3", fill: "#ff7a6b", opacity: "0.5" }, blush);
          el("circle", { cx: "10", cy: "-8", r: "3", fill: "#ff7a6b", opacity: "0.5" }, blush);

          const seed = Math.random() * 10;
          let nextBlink = seed + 1.5;
          let blinkT = -1;

          const api = {
            root,
            update(t, ctx) {
              const c = ctx || {};
              const swing = c.swing || 0; // -1..1 pendulum position
              const speed = c.speed || 0; // 0..1 excitement
              const wob = Math.sin(t * 2.1 + seed);

              // torso leans back on the way up, tucks forward on the way down
              const lean = c.seated ? Math.sin(t * 1.3 + seed) * 1.5 : -swing * 9 - speed * 4;
              body.setAttribute("transform", `rotate(${lean.toFixed(2)})`);

              // arms
              if (c.seated) {
                arms[0].setAttribute("transform", `translate(-13 -27) rotate(${(152 + wob * 6).toFixed(1)})`);
                const waving = c.wave || 0;
                arms[1].setAttribute("transform", `translate(13 -27) rotate(${(-152 + waving * 40).toFixed(1)})`);
              } else if (c.loops) {
                arms[0].setAttribute("transform", "translate(-13 -27) rotate(-16)");
                arms[1].setAttribute("transform", "translate(13 -27) rotate(16)");
              } else {
                arms[0].setAttribute("transform", `translate(-13 -27) rotate(${(-16 - swing * 5).toFixed(1)})`);
                arms[1].setAttribute("transform", `translate(13 -27) rotate(${(16 - swing * 5).toFixed(1)})`);
              }

              // legs kick out at the top of each arc
              const kick = c.seated
                ? 78 + Math.sin(t * 2.6 + seed) * 10
                : c.loops
                  ? 30
                  : 18 + swing * 34 + speed * 10;
              legs[0].hip.setAttribute("transform", `translate(-8 -2) rotate(${(kick * 0.9).toFixed(1)})`);
              legs[1].hip.setAttribute("transform", `translate(8 -2) rotate(${(kick * -0.9 + (c.seated ? 0 : 4)).toFixed(1)})`);
              legs[0].foot.setAttribute("transform", `translate(1 30) rotate(${(-kick * 0.9 - 10).toFixed(1)})`);
              legs[1].foot.setAttribute("transform", `translate(1 30) rotate(${(kick * 0.9 - 10).toFixed(1)})`);

              // head bobs and hair flaps
              head.setAttribute("transform", `translate(0 -34) rotate(${(swing * 4 + wob * 1.2).toFixed(2)})`);
              tuft.setAttribute("d", `M-2 -29 Q${(4 - swing * 5).toFixed(1)} ${(-36 - speed * 2).toFixed(1)} ${(12 - swing * 7).toFixed(1)} ${(-32 + Math.abs(swing) * 3).toFixed(1)}`);

              // expression
              mouth.setAttribute("d", speed > 0.55 || c.loops ? MOUTHS.whee : MOUTHS.smile);
              blush.setAttribute("opacity", (Math.min(0.9, speed * 1.1)).toFixed(2));

              // blinking
              if (blinkT < 0 && t > nextBlink) blinkT = 0;
              if (blinkT >= 0) {
                blinkT += 1 / 60;
                const h = blinkT < 0.07 ? (blinkT / 0.07) * 6 : blinkT < 0.16 ? (1 - (blinkT - 0.07) / 0.09) * 6 : 0;
                lidL.setAttribute("height", h.toFixed(2));
                lidR.setAttribute("height", h.toFixed(2));
                if (blinkT > 0.16) {
                  blinkT = -1;
                  nextBlink = t + 2 + Math.random() * 4;
                }
              }

              // eyes follow the cursor
              const box = root.getBoundingClientRect();
              const hx = box.left + box.width / 2;
              const hy = box.top + box.height * 0.18;
              const dx = Math.max(-1, Math.min(1, (cursor.x - hx) / 300)) * 2.6;
              const dy = Math.max(-1, Math.min(1, (cursor.y - hy) / 300)) * 1.9;
              eyeL.setAttribute("cx", (-5.5 + dx).toFixed(2));
              eyeR.setAttribute("cx", (5.5 + dx).toFixed(2));
              eyeL.setAttribute("cy", (-13 + dy).toFixed(2));
              eyeR.setAttribute("cy", (-13 + dy).toFixed(2));
            },
          };
          return api;
        }

        let parts = null;

        function build() {
          while (svg.firstChild) svg.removeChild(svg.firstChild);
          parts = { riders: [] };

          if (config.mode === "swing") {
            const ax = window.innerWidth * config.anchor;
            const pivot = el("g", { transform: `translate(${ax} 0)` });
            // the bar it hangs from
            el("rect", { x: "-42", y: "-6", width: "84", height: "7", rx: "3.5", fill: "#6b5a3c", opacity: "0.9" }, pivot);
            const arm = el("g", {}, pivot);
            parts.arm = arm;
            const halfSeat = config.twoSeater ? 62 : 34;
            const ropeL = el("path", { d: "", stroke: "#c8b58c", "stroke-width": "3", fill: "none" }, arm);
            const ropeR = el("path", { d: "", stroke: "#c8b58c", "stroke-width": "3", fill: "none" }, arm);
            parts.ropes = [ropeL, ropeR];
            parts.halfSeat = halfSeat;
            el("rect", { x: -halfSeat, y: config.rope, width: halfSeat * 2, height: "12", rx: "4", fill: "#8b5e34" }, arm);
            el("rect", { x: -halfSeat, y: config.rope, width: halfSeat * 2, height: "4", rx: "2", fill: "#b07c46" }, arm);

            const seatY = config.rope;
            if (config.twoSeater) {
              parts.riders.push(makeChar(arm, palettes[0], {}));
              parts.riders.push(makeChar(arm, palettes[1], {}));
              parts.riders[0].root.setAttribute("transform", `translate(-30 ${seatY}) scale(0.95)`);
              parts.riders[1].root.setAttribute("transform", `translate(30 ${seatY}) scale(0.95)`);
            } else {
              parts.riders.push(makeChar(arm, palettes[config.palette % 2], {}));
              parts.riders[0].root.setAttribute("transform", `translate(0 ${seatY})`);
            }
          } else {
            const y = window.innerHeight - 6;
            const left = config.corner === "left";
            const base = left ? 90 : window.innerWidth - 90;
            const spots = config.twoSeater
              ? [
                  { x: base, pal: config.palette % 2 },
                  { x: base + (left ? 76 : -76), pal: (config.palette + 1) % 2 },
                ]
              : [{ x: base, pal: config.palette % 2 }];
            for (const s of spots) {
              const c = makeChar(svg, palettes[s.pal], {});
              c.root.setAttribute("transform", `translate(${s.x} ${y - 30}) scale(1.05)`);
              c.seated = true;
              parts.riders.push(c);
            }
          }
        }

        function frame(now) {
          const t = now / 1000;
          const seated = config.mode === "sitter";
          let swing = 0;
          let speed = 0;

          if (!seated && parts && parts.arm) {
            const period = Math.max(0.6, config.period);
            let deg;
            if (config.loops) {
              deg = ((t * 360) / Math.max(1.2, period)) % 360;
              swing = Math.sin((deg * Math.PI) / 180);
              speed = 1;
            } else {
              const phase = (2 * Math.PI * t) / period;
              swing = Math.sin(phase);
              deg = config.amplitude * swing;
              // faster + wider = more excited
              speed = Math.min(1, (config.amplitude / 80) * 0.6 + (2.6 / period) * 0.4 - 0.15);
              speed = Math.max(0, speed) * Math.abs(Math.cos(phase));
            }
            parts.arm.setAttribute("transform", `rotate(${deg.toFixed(2)})`);
            // ropes bow slightly with the swing
            if (parts.ropes) {
              const hs = parts.halfSeat - 6;
              const bow = -swing * 6;
              parts.ropes[0].setAttribute("d", `M${-hs} 0 Q${-hs + bow} ${config.rope / 2} ${-hs} ${config.rope}`);
              parts.ropes[1].setAttribute("d", `M${hs} 0 Q${hs + bow} ${config.rope / 2} ${hs} ${config.rope}`);
            }
          }

          if (parts && parts.riders) {
            for (const r of parts.riders) {
              const wave = seated ? Math.max(0, Math.sin(t * 0.55)) * Math.max(0, Math.sin(t * 7)) : 0;
              r.update(t, { swing, speed, seated, loops: config.loops && !seated, wave });
            }
          }
          requestAnimationFrame(frame);
        }

        function apply(next) {
          Object.assign(config, next || {});
          build();
        }

        window.addEventListener("resize", build);
        window.addEventListener("mousemove", (e) => {
          cursor = { x: e.clientX, y: e.clientY };
        });
        // config from the desktop app (tray menu)
        if (window.swingers && window.swingers.onConfig) {
          window.swingers.onConfig(apply);
          if (window.swingers.onCursor) window.swingers.onCursor((p) => (cursor = p));
        }
        // config from the web page hosting this in an iframe
        window.addEventListener("message", (e) => {
          if (e.data && e.data.type === "swingers:config") apply(e.data.config);
        });
        // let the host know we are ready for config
        try {
          if (window.parent && window.parent !== window)
            window.parent.postMessage({ type: "swingers:ready" }, "*");
        } catch (err) {
          /* ignore */
        }
        // config from the query string
        const q = new URLSearchParams(location.search);
        const initial = {};
        for (const [k, v] of q.entries()) {
          if (v === "true" || v === "false") initial[k] = v === "true";
          else initial[k] = isNaN(Number(v)) ? v : Number(v);
        }
        apply(initial);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
